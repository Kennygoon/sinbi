<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주문 관리</title>
<style>
  :root{--bg:#f6f1e7;--card:#fff;--line:#e6dac4;--ink:#33271b;--muted:#7a6650;--orange:#e5701a;--red:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:21px;margin:6px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .in{border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;font-size:15px;background:#fff}
  .btn{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;min-height:44px;padding:0 18px;font-size:15px;cursor:pointer}
  .btn.ghost{background:#fff;color:#c85a0b;border:1.5px solid var(--orange)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .bar .grow{flex:1;min-width:160px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .stat small{color:var(--muted);display:block;font-size:12.5px}
  .stat b{font-size:20px}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:68vh}
  table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
  th,td{padding:8px 10px;border-bottom:1px solid #f0e8d8;text-align:left}
  th{position:sticky;top:0;background:#fde7c8;z-index:1}
  td.num{text-align:right}
  tr:hover td{background:#fffaf0}
  .msg{margin:10px 0;font-size:14px;color:var(--muted)}
  .msg.err{color:#8c1d18;background:#fdecea;border:1px solid #f3b8b3;border-radius:10px;padding:10px 12px}
  #login{max-width:420px;margin:12vh auto}
  .stockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
  .stockgrid label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
  .stockgrid .in{width:100%}
  .ok{color:#2e7d32;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card">
    <h1>주문 관리</h1>
    <p class="msg">관리자 비밀번호를 입력하세요.</p>
    <form id="loginForm" style="display:flex;gap:8px">
      <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" style="flex:1">
      <button class="btn" type="submit" id="loginBtn">확인</button>
    </form>
    <div class="msg err" id="loginErr" hidden></div>
  </div>

  <div id="app" hidden>
    <h1>주문 관리</h1>
    <div class="card" id="stockCard" style="margin-bottom:14px">
      <b>재고 관리 (남은 박스 수)</b>
      <p class="msg" style="margin:4px 0 0">값을 고치고 ‘재고 저장’을 누르세요. 비워 두면 무제한입니다. 주문이 접수되면 자동으로 차감되고, 0이 되면 고객 화면에 ‘품절’로 표시됩니다.</p>
      <div class="stockgrid">
        <div><label for="st-special">특품 5kg</label><input class="in" id="st-special" type="number" min="0" inputmode="numeric" placeholder="무제한"></div>
        <div><label for="st-grade">상품 10kg</label><input class="in" id="st-grade" type="number" min="0" inputmode="numeric" placeholder="무제한"></div>
        <div><label for="st-normal">보통 10kg</label><input class="in" id="st-normal" type="number" min="0" inputmode="numeric" placeholder="무제한"></div>
      </div>
      <button class="btn" id="saveStock" type="button">재고 저장</button>
      <span class="msg" id="stockMsg" style="margin-left:8px"></span>
      <p class="msg" style="margin:8px 0 0">※ 입금되지 않아 주문을 취소한 경우, 해당 수량을 직접 더해서 저장해 주세요.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input class="in grow" id="q" type="search" placeholder="이름·전화·주소·주문번호 검색">
      <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="onlyToday"> 오늘 접수만</label>
      <button class="btn ghost" id="reload" type="button">새로고침</button>
      <button class="btn" id="xlsx" type="button">엑셀 다운로드</button>
    </div>
    <div class="msg" id="count"></div>
    <div class="tablewrap"><table id="tbl"></table></div>
    <p class="msg">‘입금확인 · 출고 · 송장번호’는 구글 시트에서 직접 입력하면 여기에도 반영됩니다(새로고침).</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Apps Script 배포 후 받은 웹 앱 URL (index.html 의 API_URL 과 같은 값)
const API_URL = '';

const $ = (id) => document.getElementById(id);
const won = (n) => Number(n || 0).toLocaleString('ko-KR');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = '', HEADERS = [], ROWS = [];

function fmtPhone(p){
  const d = String(p || '').replace(/\D/g,'');
  if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  return p;
}
async function fetchList(){
  if(!API_URL) throw new Error('admin.html 의 API_URL 이 비어 있습니다. Apps Script 웹 앱 URL 을 넣어 주세요.');
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'list', key: KEY }) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || '조회에 실패했습니다.');
  HEADERS = j.headers; ROWS = j.rows; fillStock(j.stock);
}
const STOCK_KEYS = ['special','grade','normal'];
function fillStock(stock){
  STOCK_KEYS.forEach(k => { $('st-' + k).value = (stock && typeof stock[k] === 'number') ? stock[k] : ''; });
}
$('saveStock').addEventListener('click', async () => {
  const stock = {}; STOCK_KEYS.forEach(k => { stock[k] = $('st-' + k).value.trim(); });
  $('saveStock').disabled = true; $('stockMsg').className = 'msg'; $('stockMsg').textContent = '저장 중…';
  try{
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'setStock', key: KEY, stock }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || '저장에 실패했습니다.');
    fillStock(j.stock); $('stockMsg').className = 'msg ok'; $('stockMsg').textContent = '저장되었습니다 ✓';
  }catch(err){
    $('stockMsg').className = 'msg err'; $('stockMsg').textContent = err.message;
  }
  $('saveStock').disabled = false;
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  KEY = $('pw').value; $('loginBtn').disabled = true; $('loginErr').hidden = true;
  try{
    await fetchList();
    $('login').hidden = true; $('app').hidden = false; render();
  }catch(err){
    $('loginErr').textContent = err.message; $('loginErr').hidden = false; KEY = '';
  }finally{ $('loginBtn').disabled = false; }
});
$('reload').addEventListener('click', async () => {
  $('reload').disabled = true;
  try{ await fetchList(); render(); }catch(err){ alert(err.message); }
  $('reload').disabled = false;
});
$('q').addEventListener('input', render);
$('onlyToday').addEventListener('change', render);

function todayStr(){
  const d = new Date(); const p = (n) => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function view(){
  const q = $('q').value.trim().toLowerCase(), today = todayStr(), only = $('onlyToday').checked;
  const idx = (name) => HEADERS.indexOf(name);
  return ROWS.filter(r => {
    if(only && !String(r[idx('접수시각')]).startsWith(today)) return false;
    if(!q) return true;
    return r.some(c => String(c).toLowerCase().includes(q));
  }).reverse(); // 최신 주문이 위로
}
function render(){
  const rows = view(), idx = (n) => HEADERS.indexOf(n);
  const sum = (n) => rows.reduce((s, r) => s + Number(r[idx(n)] || 0), 0);
  $('stats').innerHTML = [
    ['주문 건수', rows.length + '건'],
    ['특품 5kg', sum('특품5kg 수량') + '박스'],
    ['상품 10kg', sum('상품10kg 수량') + '박스'],
    ['보통 10kg', sum('보통10kg 수량') + '박스'],
    ['결제 금액 합계', won(sum('결제금액(원)')) + '원'],
  ].map(([k,v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('');
  $('count').textContent = `전체 ${ROWS.length}건 중 ${rows.length}건 표시`;
  const pi = idx('전화번호'), mi = idx('결제금액(원)');
  $('tbl').innerHTML = '<thead><tr>' + HEADERS.map(h => `<th>${esc(h)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c, i) => `<td class="${i === mi ? 'num' : ''}">${esc(i === pi ? fmtPhone(c) : i === mi ? won(c) : c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
}

/* 엑셀 다운로드: 현재 화면(검색·오늘 필터 적용)의 내용을 오래된 순으로 저장 */
$('xlsx').addEventListener('click', () => {
  const rows = view().slice().reverse(); // 접수 순서대로
  const pi = HEADERS.indexOf('전화번호');
  const data = [HEADERS].concat(rows.map(r => r.map((c, i) => i === pi ? fmtPhone(c) : c)));
  const d = new Date(), p = (n) => String(n).padStart(2,'0');
  const stamp = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  if(window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = HEADERS.map(h => ({ wch: /주소/.test(h) ? 38 : /요청|상세/.test(h) ? 24 : /시각/.test(h) ? 19 : 13 }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '주문');
    XLSX.writeFile(wb, `감주문_${stamp}.xlsx`);
  } else {
    // 엑셀 라이브러리를 못 불러온 경우: 엑셀에서 열리는 CSV 로 대체
    const csv = '﻿' + data.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = `감주문_${stamp}.csv`; document.body.appendChild(a); a.click(); a.remove();
  }
});
</script>
</body>
</html>
